# Production docker-compose
# All secrets come from the host .env file (never commit .env to git)
# Run: docker compose -f docker-compose.prod.yml up -d

networks:
  app_net:
    driver: bridge
  monitor_net:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
  loki_data:
  pgadmin_data:

services:
  # ── Database ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Game Server ───────────────────────────────────────────────────────────────
  server:
    image: ghcr.io/${GITHUB_REPOSITORY}/server:${IMAGE_TAG:-latest}
    container_name: vx-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-100}
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Admin Server ──────────────────────────────────────────────────────────────
  admin-server:
    image: ghcr.io/${GITHUB_REPOSITORY}/admin-server:${IMAGE_TAG:-latest}
    container_name: vx-admin-server
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: production
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS}
      ADMIN_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Player Client (Next.js) ───────────────────────────────────────────────────
  client:
    image: ghcr.io/${GITHUB_REPOSITORY}/client:${IMAGE_TAG:-latest}
    container_name: vx-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://server:3001
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Admin Client (Next.js) ────────────────────────────────────────────────────
  admin-client:
    image: ghcr.io/${GITHUB_REPOSITORY}/admin-client:${IMAGE_TAG:-latest}
    container_name: vx-admin-client
    restart: unless-stopped
    depends_on:
      - admin-server
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: 0.0.0.0
      INTERNAL_ADMIN_API_URL: http://admin-server:3002
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx (SSL termination + reverse proxy) ───────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: vx-nginx
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
      admin-server:
        condition: service_healthy
      admin-client:
        condition: service_healthy
      grafana:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/admin.conf:/etc/nginx/admin.conf:ro
      # nginx.conf and admin.conf are generated from *.template by deploy.sh
      # admin.conf is empty if the admin SSL cert is missing
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    networks:
      - app_net
      - monitor_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: vx-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - app_net
      - monitor_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Loki (log aggregation) ────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: vx-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./deploy/monitoring/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitor_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── pgAdmin (Postgres web UI) ────────────────────────────────────────────────
  # Reached at https://admin.${DOMAIN}/pgadmin/ behind IP allowlist + admin auth.
  # Listens on app_net only — no public ports, only nginx can talk to it.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vx-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # Served under /pgadmin/ — pgadmin needs this to generate correct URLs
      SCRIPT_NAME: /pgadmin
      # Disable update checks and telemetry
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      # Don't show the master password prompt — we trust the network boundary
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Auto-registered Postgres connection (generated by deploy.sh)
      - ./deploy/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./deploy/pgadmin/pgpass:/pgadmin4/pgpass:ro
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Promtail (ships container logs → Loki) ────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: vx-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./deploy/monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitor_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: vx-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - monitor_net
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
