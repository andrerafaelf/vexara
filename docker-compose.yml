version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: neon-dominion-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: neon-dominion
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: neon-dominion-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
