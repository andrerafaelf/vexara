name: Backfill supporter titles (one-time)

on:
  workflow_dispatch:

jobs:
  backfill:
    name: Run backfill
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Upload script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "server/scripts/backfill-supporter-titles.ts"
          target: "/tmp"

      - name: Run backfill inside server container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            docker cp /tmp/server/scripts/backfill-supporter-titles.ts vx-server:/app/backfill-supporter-titles.ts
            docker exec vx-server npx tsx backfill-supporter-titles.ts
            docker exec vx-server rm backfill-supporter-titles.ts
            rm -rf /tmp/server
            echo "Done."
