name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # e.g. ghcr.io/andrerafaelf/vexara
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/vexara

jobs:
  # ─── Lint & Test ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Type-check server
        working-directory: server
        run: npx tsc --noEmit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Type-check client
        working-directory: client
        run: npx tsc --noEmit

  # ─── Build & Push Docker Images ──────────────────────────────────────────────
  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: server
            context: ./server
            file: ./server/Dockerfile
            image_suffix: server
          - service: admin-server
            context: .
            file: ./admin-server/Dockerfile
            image_suffix: admin-server
          - service: client
            context: ./client
            file: ./client/Dockerfile
            image_suffix: client
            build_args: |
              NEXT_PUBLIC_API_URL=https://${{ vars.DOMAIN }}/api
              NEXT_PUBLIC_APP_URL=https://${{ vars.DOMAIN }}
          - service: admin-client
            context: ./admin-client
            file: ./admin-client/Dockerfile
            image_suffix: admin-client
            build_args: |
              NEXT_PUBLIC_ADMIN_API_URL=https://admin.${{ vars.DOMAIN }}/api

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image_suffix }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to VPS ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Derive image tag
        id: tag
        run: echo "IMAGE_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Clean deploy files on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/vexara
            rm -rf /opt/vexara/docker-compose.prod.yml /opt/vexara/deploy

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/"
          target: "/opt/vexara"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/vexara

            # Write .env from GitHub secrets (never stored in git)
            cat > .env <<'ENVEOF'
            GITHUB_REPOSITORY=${{ github.repository }}
            IMAGE_TAG=${{ steps.tag.outputs.IMAGE_TAG }}
            DOMAIN=${{ vars.DOMAIN }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
            ADMIN_USER=${{ secrets.ADMIN_USER }}
            ADMIN_PASS=${{ secrets.ADMIN_PASS }}
            ADMIN_CORS_ORIGINS=${{ vars.ADMIN_CORS_ORIGINS }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_SUBJECT=${{ vars.VAPID_SUBJECT }}
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
            ENVEOF

            # Log in to GHCR on the VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Zero-downtime rolling update
            bash /opt/vexara/deploy/deploy.sh ${{ steps.tag.outputs.IMAGE_TAG }}

      - name: Smoke test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # Wait up to 60s for healthcheck
            for i in $(seq 1 12); do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://${{ vars.DOMAIN }}/healthz || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Smoke test passed (HTTP 200)"
                exit 0
              fi
              echo "Attempt $i: got $STATUS, retrying in 5s..."
              sleep 5
            done
            echo "Smoke test FAILED after 60s"
            exit 1
