name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - 'docker-compose*.yml'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - 'docker-compose*.yml'
      - '**.md'
      - '.gitignore'
  # Manual run: redeploys the current images (e.g. onto a fresh VPS, or after
  # deploy/ or compose changes, which push ignores). rebuild_all forces every
  # image to rebuild from this commit.
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild and push all four images
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/vexara

jobs:
  # ─── Detect changed services ─────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server == 'true' || inputs.rebuild_all == true }}
      admin-server: ${{ steps.filter.outputs.admin-server == 'true' || inputs.rebuild_all == true }}
      client: ${{ steps.filter.outputs.client == 'true' || inputs.rebuild_all == true }}
      admin-client: ${{ steps.filter.outputs.admin-client == 'true' || inputs.rebuild_all == true }}
      any-src: ${{ steps.filter.outputs.any-src == 'true' || inputs.rebuild_all == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@v3
        id: filter
        # No push/PR base to diff against on a manual run; rebuild_all decides.
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            server:
              - 'server/**'
            admin-server:
              - 'admin-server/**'
              - 'server/services/emailService.ts'
              - 'server/lib/**'
            client:
              - 'client/**'
            admin-client:
              - 'admin-client/**'
            any-src:
              - 'server/**'
              - 'client/**'
              - 'admin-server/**'
              - 'admin-client/**'

  # ─── Server: test + typecheck ────────────────────────────────────────────────
  test-server:
    name: Test server
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Type-check server
        working-directory: server
        run: ./node_modules/.bin/tsc --noEmit

  # ─── Client: typecheck only (no tests configured) ────────────────────────────
  typecheck-client:
    name: Typecheck client
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.client == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Type-check client
        working-directory: client
        run: ./node_modules/.bin/tsc --noEmit

  # ─── Build & Push Docker Images ──────────────────────────────────────────────
  build-server:
    name: Build server
    runs-on: ubuntu-latest
    needs: [test-server, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server,ignore-error=true

  build-admin-server:
    name: Build admin-server
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.admin-server == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/admin-server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./admin-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin-server
          cache-to: type=gha,mode=max,scope=admin-server,ignore-error=true

  build-client:
    name: Build client
    runs-on: ubuntu-latest
    needs: [typecheck-client, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.client == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/client
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.DOMAIN }}/api
            NEXT_PUBLIC_APP_URL=https://${{ vars.DOMAIN }}
            BUILD_ID=sha-${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client,ignore-error=true

  build-admin-client:
    name: Build admin-client
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.admin-client == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/admin-client
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./admin-client
          file: ./admin-client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ADMIN_API_URL=https://admin.${{ vars.DOMAIN }}/api/admin
          cache-from: type=gha,scope=admin-client
          cache-to: type=gha,mode=max,scope=admin-client,ignore-error=true

  # ─── Deploy to VPS ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, build-server, build-admin-server, build-client, build-admin-client]
    if: |
      github.ref == 'refs/heads/main' &&
      !failure() && !cancelled()
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Derive image tags
        id: tag
        run: |
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          [[ '${{ needs.changes.outputs.server }}'       == 'true' ]] && echo "SERVER_TAG=${SHA_TAG}"       >> $GITHUB_OUTPUT || echo "SERVER_TAG=latest"       >> $GITHUB_OUTPUT
          [[ '${{ needs.changes.outputs.admin-server }}' == 'true' ]] && echo "ADMIN_SERVER_TAG=${SHA_TAG}" >> $GITHUB_OUTPUT || echo "ADMIN_SERVER_TAG=latest" >> $GITHUB_OUTPUT
          [[ '${{ needs.changes.outputs.client }}'       == 'true' ]] && echo "CLIENT_TAG=${SHA_TAG}"       >> $GITHUB_OUTPUT || echo "CLIENT_TAG=latest"       >> $GITHUB_OUTPUT
          [[ '${{ needs.changes.outputs.admin-client }}' == 'true' ]] && echo "ADMIN_CLIENT_TAG=${SHA_TAG}" >> $GITHUB_OUTPUT || echo "ADMIN_CLIENT_TAG=latest" >> $GITHUB_OUTPUT

      - name: Clean deploy files on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/vexara
            rm -rf /opt/vexara/docker-compose.prod.yml /opt/vexara/deploy

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/"
          target: "/opt/vexara"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/vexara

            cat > .env <<'ENVEOF'
            GITHUB_REPOSITORY=${{ github.repository }}
            SERVER_TAG=${{ steps.tag.outputs.SERVER_TAG }}
            ADMIN_SERVER_TAG=${{ steps.tag.outputs.ADMIN_SERVER_TAG }}
            CLIENT_TAG=${{ steps.tag.outputs.CLIENT_TAG }}
            ADMIN_CLIENT_TAG=${{ steps.tag.outputs.ADMIN_CLIENT_TAG }}
            DOMAIN=${{ vars.DOMAIN }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
            ADMIN_USER=${{ secrets.ADMIN_USER }}
            ADMIN_PASS=${{ secrets.ADMIN_PASS }}
            ADMIN_SESSION_SECRET=${{ secrets.ADMIN_SESSION_SECRET }}
            ADMIN_TOTP_SECRET=${{ secrets.ADMIN_TOTP_SECRET }}
            ADMIN_COOKIE_DOMAIN=${{ secrets.ADMIN_COOKIE_DOMAIN }}
            ADMIN_CORS_ORIGINS=${{ vars.ADMIN_CORS_ORIGINS }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_SUBJECT=${{ vars.VAPID_SUBJECT }}
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
            PGADMIN_EMAIL=${{ secrets.PGADMIN_EMAIL }}
            PGADMIN_PASSWORD=${{ secrets.PGADMIN_PASSWORD }}
            ADMIN_ALLOW_IPS=${{ vars.ADMIN_ALLOW_IPS }}
            PGADMIN_ALLOW_IPS=${{ vars.PGADMIN_ALLOW_IPS }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            KOFI_VERIFICATION_TOKEN=${{ secrets.KOFI_VERIFICATION_TOKEN }}
            ALPHA_ACTIVE=${{ vars.ALPHA_ACTIVE }}
            R2_ACCOUNT_ID=${{ vars.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET=${{ vars.R2_BUCKET }}
            R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}
            ENVEOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            bash /opt/vexara/deploy/deploy.sh
