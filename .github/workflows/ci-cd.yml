name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # e.g. ghcr.io/andrerafaelf/vexara
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/vexara

jobs:
  # ─── Lint & Test ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Type-check server
        working-directory: server
        run: npx tsc --noEmit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Type-check client
        working-directory: client
        run: npx tsc --noEmit

  # ─── Detect changed services ─────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      server: ${{ steps.filter.outputs.server }}
      admin-server: ${{ steps.filter.outputs.admin-server }}
      client: ${{ steps.filter.outputs.client }}
      admin-client: ${{ steps.filter.outputs.admin-client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            admin-server:
              - 'admin-server/**'
            client:
              - 'client/**'
            admin-client:
              - 'admin-client/**'

  # ─── Build & Push Docker Images ──────────────────────────────────────────────
  build-server:
    name: Build server
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin-server:
    name: Build admin-server
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.admin-server == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/admin-server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admin-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-client:
    name: Build client
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.client == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/client
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.DOMAIN }}/api
            NEXT_PUBLIC_APP_URL=https://${{ vars.DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin-client:
    name: Build admin-client
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.admin-client == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/admin-client
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: ./admin-client
          file: ./admin-client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ADMIN_API_URL=https://admin.${{ vars.DOMAIN }}/api/admin
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to VPS ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, build-server, build-admin-server, build-client, build-admin-client]
    # Run if all builds either succeeded or were skipped (not if any failed)
    if: |
      github.ref == 'refs/heads/main' &&
      !failure() && !cancelled()
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: tag
        run: |
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          [[ '${{ needs.changes.outputs.server }}'       == 'true' ]] && echo "SERVER_TAG=${SHA_TAG}"       >> $GITHUB_OUTPUT || echo "SERVER_TAG=latest"       >> $GITHUB_OUTPUT
          [[ '${{ needs.changes.outputs.admin-server }}' == 'true' ]] && echo "ADMIN_SERVER_TAG=${SHA_TAG}" >> $GITHUB_OUTPUT || echo "ADMIN_SERVER_TAG=latest" >> $GITHUB_OUTPUT
          [[ '${{ needs.changes.outputs.client }}'       == 'true' ]] && echo "CLIENT_TAG=${SHA_TAG}"       >> $GITHUB_OUTPUT || echo "CLIENT_TAG=latest"       >> $GITHUB_OUTPUT
          [[ '${{ needs.changes.outputs.admin-client }}' == 'true' ]] && echo "ADMIN_CLIENT_TAG=${SHA_TAG}" >> $GITHUB_OUTPUT || echo "ADMIN_CLIENT_TAG=latest" >> $GITHUB_OUTPUT

      - name: Clean deploy files on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/vexara
            rm -rf /opt/vexara/docker-compose.prod.yml /opt/vexara/deploy

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/"
          target: "/opt/vexara"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/vexara

            # Write .env from GitHub secrets (never stored in git)
            cat > .env <<'ENVEOF'
            GITHUB_REPOSITORY=${{ github.repository }}
            SERVER_TAG=${{ steps.tag.outputs.SERVER_TAG }}
            ADMIN_SERVER_TAG=${{ steps.tag.outputs.ADMIN_SERVER_TAG }}
            CLIENT_TAG=${{ steps.tag.outputs.CLIENT_TAG }}
            ADMIN_CLIENT_TAG=${{ steps.tag.outputs.ADMIN_CLIENT_TAG }}
            DOMAIN=${{ vars.DOMAIN }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
            ADMIN_USER=${{ secrets.ADMIN_USER }}
            ADMIN_PASS=${{ secrets.ADMIN_PASS }}
            ADMIN_CORS_ORIGINS=${{ vars.ADMIN_CORS_ORIGINS }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_SUBJECT=${{ vars.VAPID_SUBJECT }}
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
            PGADMIN_EMAIL=${{ secrets.PGADMIN_EMAIL }}
            PGADMIN_PASSWORD=${{ secrets.PGADMIN_PASSWORD }}
            PGADMIN_ALLOW_IPS=${{ vars.PGADMIN_ALLOW_IPS }}
            MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}
            ENVEOF

            # Log in to GHCR on the VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Zero-downtime rolling update
            bash /opt/vexara/deploy/deploy.sh

      - name: Smoke test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 12); do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://${{ vars.DOMAIN }}/healthz)
              if [ "$STATUS" = "200" ]; then
                echo "Smoke test passed (HTTP 200)"
                exit 0
              fi
              echo "Attempt $i: got $STATUS, retrying in 5s..."
              sleep 5
            done
            echo "Smoke test FAILED after 60s"
            exit 1

